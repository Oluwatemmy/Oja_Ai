name: ojaai
description: "OjaAI - talk your sales and debts, Gemma writes your ledger. Fully on-device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^1.3.1
  flutter_gemma_litertlm: ^1.1.0
  background_downloader: ^9.5.6
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  record: ^7.1.1
  path_provider: ^2.1.4
  provider: ^6.1.2
  sqflite: ^2.4.1
  flutter_tts: ^4.2.5
  camera: ^0.11.0+2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
